[project]
name = "voice-by-sumanonline"
version = "0.1.0"
description = "Voice by SumanOnline — cross-platform AI voice dictation desktop app same as Wispr Flow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SumanOnline" }]
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
    "keyring>=24.0.0",
    "httpx>=0.27.0",
    "vosk>=0.3.44",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pywin32>=306; sys_platform == 'win32'",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
wayland = [
    "evdev>=1.6.0; sys_platform == 'linux'",
]

[project.scripts]
voice-by-sumanonline = "voice_by_sumanonline.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voice_by_sumanonline"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
